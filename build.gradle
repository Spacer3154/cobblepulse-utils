plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { name = 'Cobblemon'; url = 'https://maven.impactdev.net/repository/development/' }
    maven { name = 'Nucleoid'; url = 'https://maven.nucleoid.xyz/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "cobblepulse_utils" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "net.fabricmc:fabric-language-kotlin:${project.flk_version}"

    // Cobblemon (Pokemon, especes, spawns, combats, stockage, Pokedex)
    modImplementation("com.cobblemon:fabric:${project.cobblemon_version}") { transitive = false }

    // Integration optionnelle (presente sur le serveur, non embarquee)
    compileOnly "net.luckperms:api:${project.luckperms_api_version}"

    // Bibliotheques embarquees (Jar-in-Jar) : base de donnees + messages.toml
    implementation('com.zaxxer:HikariCP:5.1.0') { exclude group: 'org.slf4j' }
    include 'com.zaxxer:HikariCP:5.1.0'
    implementation('com.mysql:mysql-connector-j:8.4.0') { transitive = false }
    include 'com.mysql:mysql-connector-j:8.4.0'
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    include 'org.xerial:sqlite-jdbc:3.46.1.3'
    implementation 'com.electronwill.night-config:core:3.6.7'
    include 'com.electronwill.night-config:core:3.6.7'
    implementation 'com.electronwill.night-config:toml:3.6.7'
    include 'com.electronwill.night-config:toml:3.6.7'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
    it.options.compilerArgs += ['-Xmaxerrs', '1000']
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// CI : copie des bibliotheques de compilation (Minecraft remappe, Fabric API, Cobblemon...) pour compiler hors Gradle
tasks.register('exportDeps') {
    doLast {
        def dst = layout.buildDirectory.dir('deps').get().asFile
        dst.mkdirs()
        def seen = [] as Set
        [configurations.compileClasspath, configurations.clientCompileClasspath].each { conf ->
            conf.resolve().each { f ->
                if (f.isFile() && f.name.endsWith('.jar') && seen.add(f.name)) {
                    java.nio.file.Files.copy(f.toPath(), new File(dst, f.name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
            }
        }
        // Minecraft remappe (client + commun) : fichiers fournis par Loom hors configurations classiques
        sourceSets.client.compileClasspath.each { f ->
            if (f.isFile() && f.name.endsWith('.jar') && seen.add(f.name)) {
                java.nio.file.Files.copy(f.toPath(), new File(dst, f.name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        }
        println "exportDeps: ${seen.size()} jars"
    }
}
