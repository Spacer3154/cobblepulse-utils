# =====================================================================
#  CobblePulse - Recompenses de tournoi (systeme hybride)
#  1) Items : /tournoi rewards edit <palier> puis glisser-deposer les items.
#     Les gagnants les recuperent avec /tournoi claim.
#  2) Commandes console ci-dessous. Variables : %player% %place% %tournament% %tier%
#  Un joueur recoit le palier correspondant a sa meilleure place possible
#  (ex. perdants de quart de finale = 5e => palier top5).
# =====================================================================

[tiers.first]
label = "1ère place (Vainqueur)"
min = 1
max = 1
commands = ["eco give %player% 10000"]

