# Liste indicative inspiree des formats Smogon : ajustez-la selon votre metagame.
# Identifiants : nom de l espece sans espaces ni ponctuation (ex. "mrmime"), forme collee ("kyuremblack").
# Champs : inherits (herite des bans d un autre tier), banned_pokemon, allowed_pokemon, banned_items,
# banned_abilities, banned_moves, level_cap (0 = aucun), min_team_size, max_team_size, section [rules].
display_name = "NFE (Not Fully Evolved)"
description = "Uniquement des Pokemon pouvant encore evoluer."
inherits = ""
banned_pokemon = ["porygon2", "scyther", "duraludon", "dusclops", "gligar", "sneasel", "sneaselhisui", "qwilfishhisui"]
banned_items = ["kingsrock", "razorfang", "brightpowder", "laxincense"]
banned_abilities = ["moody", "shadowtag", "arenatrap"]
banned_moves = ["batonpass", "doubleteam", "minimize", "fissure", "guillotine", "horndrill", "sheercold"]
level_cap = 0
min_team_size = 1
max_team_size = 6

[rules]
species_clause = true
require_not_fully_evolved = true
